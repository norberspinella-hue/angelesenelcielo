<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#e0d0f0; display:flex; 
       justify-content:center; gap:24px; padding:24px; flex-wrap:wrap; align-items:center; }
.card {
  width: 320px;
  border-radius: 24px;
  border: 2.5px solid rgba(255,255,255,0.95);
  box-shadow: 0 12px 40px rgba(100,70,150,0.18);
  overflow: hidden;
  position: relative;
  height: 374px;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #D5B2F1 0%, #EAA8C3 60%, #F5D3C8 100%);
}
.bg-top {
  position: absolute;
  top:0; left:0; right:0; height:220px;
  background: url('../public/images/mural-preview/previewrecuerdo.svg') 
  no-repeat center bottom / cover,
  linear-gradient(180deg, #C8A8E8 0%, #E8C0D0 100%);
  z-index: 1;
}
.bg-bottom {
  position: absolute;
  top:220px; left:0; right:0; height:154px;
  background: url('../public/images/mural-preview/bannerdogs.png') 
  no-repeat center bottom / 100% 100%,
  linear-gradient(180deg, #F5C8A0 0%, #F8D8B8 100%);
  z-index: 1;
}

.content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 374px;
  padding: 30px 20px 0;
}
.halo {
  position: absolute;
  top: -30px; left: 50%;
  transform: translateX(-50%) rotateX(45deg);
  width: 68px; height: 26px;
  border: 3.5px solid #FFF59D;
  border-radius: 50%;
  box-shadow: 0 0 20px #FFF59D, 0 0 8px #FFD54F, inset 0 0 12px #FFF59D;
  background: rgba(255, 245, 157, 0.12);
  z-index: 1;
}
.photo-wrap { position:relative; width:100px; height:100px; margin-bottom:10px; }
.photo-circle {
  width:100px; height:100px;
  border-radius:50%;
  border:4.5px solid #FFE082;
  box-shadow: 0 4px 15px rgba(255,213,79,0.25);
  background:white;
  display:flex; align-items:center;
  justify-content:center;
  position:relative; z-index:2;
  overflow:hidden;
}
.photo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.pet-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size:32px; font-weight:700;
  font-style:normal; color:#4A3F6B;
  margin-bottom:4px;
}
.tagline { font-size:14px; color:#7B6F9A; font-weight:500; }
.divider {
  position: absolute;
  top: 220px; left:0; right:0;
  height: 38px;
  display: flex; align-items: center;
  transform: translateY(-50%);
  z-index: 20;
  padding: 0 20px;
}
.divider-line { flex:1; height:2px; background:rgba(236,111,163,0.40); }
.divider-heart {
  width:38px; height:38px;
  border-radius:50%; background:white;
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
  box-shadow: 0 2px 10px rgba(236,111,163,0.35);
  flex-shrink: 0; margin: 0 10px;
}
.btn {
  position: absolute;
  bottom: 24px;
  background: rgba(255, 255, 255, 0.25);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  border-radius: 9999px;
  padding: 8px 24px;
  font-weight: bold;
  color: #4A3F6B;
  font-size: 13px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  cursor: pointer;
}

/* ESTILOS DE LA TARJETA 2 (COMPARTIR) */
.card-share {
  width: 320px;
  border-radius: 24px;
  border: 1.5px solid rgba(255,255,255,0.65);
  box-shadow: 0 12px 40px rgba(30,10,50,0.15);
  overflow: hidden;
  position: relative;
  height: 374px;
  background: linear-gradient(180deg, rgba(255, 230, 235, 0.85) 0%, rgba(250, 200, 215, 0.85) 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 15px;
}
.close-btn {
  position: absolute;
  top: 12px; right: 12px;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.05);
  color: #706A95;
  font-weight: bold;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.share-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: bold;
  font-size: 18px;
  color: #4A3F6B;
  margin: 12px 0 6px;
  text-align: center;
}
.share-desc {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: #7B6F9A;
  margin-bottom: 20px;
  text-align: center;
  line-height: 1.4;
}
.social-buttons {
  display: flex;
  gap: 12px;
  width: 100%;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  padding: 0 5px;
}
.social-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  width: 52px;
}
.icon-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.label-style {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  text-align: center;
  color: #4A3F6B;
  white-space: nowrap;
}
.label-style-tiktok {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 500;
  text-align: center;
  color: #9B8FB0;
  white-space: nowrap;
}
</style>
</head>
<body>

<!-- TARJETA 1: PERFIL -->
<div class="card">
  <div class="bg-top"></div>
  <div class="bg-bottom"></div>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-heart">🩷</div>
    <div class="divider-line"></div>
  </div>
  <div class="content">
    <div class="photo-wrap">
      <div class="halo"></div>
      <div class="photo-circle">
        <img src="https://hmfdauxrpolpvbzlxenq.supabase.co/storage/v1/object/public/pet-photos/pets/original/1783865202220.png" alt="Mascota Real" />
      </div>
    </div>
    <div class="pet-name">Galleta</div>
    <div style="font-family: 'Inter', sans-serif; font-size: 12px; color: #7B6F9A; font-weight: 600; margin-top: 54px; margin-bottom: 0; text-align: center; white-space: nowrap;">12 de mayo de 2012 — 15 de julio de 2024</div>
    <div class="tagline" style="margin-top: 10px;">Siempre en nuestros corazones</div>
    <div class="btn">9 luces en el cielo</div>
  </div>
</div>

<!-- TARJETA 2: COMPARTIR -->
<div class="card-share">
  <button class="close-btn">✕</button>
  
  <div style="height: 20px;"></div> <!-- Espaciador para centrar más -->
  
  <h4 class="share-title">Haz que su recuerdo siga brillando</h4>
  <p class="share-desc">Comparte a Galleta y ayuda a que su luz llegue a más personas. ✨</p>
  
  <div class="social-buttons">
    <!-- WhatsApp -->
    <div class="social-item">
      <div class="icon-circle" style="background: #25D366; box-shadow: 0 6px 15px rgba(37,211,102,0.25);">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="white">
          <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
        </svg>
      </div>
      <span class="label-style">WhatsApp</span>
    </div>

    <!-- Instagram -->
    <div class="social-item">
      <div class="icon-circle" style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); box-shadow: 0 6px 15px rgba(220,39,67,0.25);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
          <rect x="3" y="3" width="18" height="18" rx="5.5"/>
          <circle cx="12" cy="12" r="4.4"/>
          <circle cx="17.3" cy="6.7" r="1" fill="white"/>
        </svg>
      </div>
      <span class="label-style">Instagram</span>
    </div>

    <!-- TikTok -->
    <div class="social-item">
      <div class="icon-circle" style="background: #000000; box-shadow: 0 8px 20px rgba(0,0,0,0.25); width: 50px; height: 50px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.2 8.2 0 0 0 4.79 1.52V6.78a4.85 4.85 0 0 1-1.03-.09z"/>
        </svg>
      </div>
      <span class="label-style-tiktok">TikTok</span>
    </div>

    <!-- Facebook -->
    <div class="social-item">
      <div class="icon-circle" style="background: #1877F2; box-shadow: 0 6px 15px rgba(24,119,242,0.25);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
          <path d="M14 13.5h2.5l1-4H14v-2c0-1.03.3-2 2-2h1.5V1.5c-.3-.04-1.2-.1-2.5-.1-2.6 0-4.5 1.6-4.5 4.5v3.1H7v4h3.5V22h3.5V13.5z"/>
        </svg>
      </div>
      <span class="label-style">Facebook</span>
    </div>

    <!-- Copiar enlace -->
    <div class="social-item">
      <div class="icon-circle" style="background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%); box-shadow: 0 6px 15px rgba(124,58,237,0.25);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <span class="label-style">Copiar enlace</span>
    </div>
  </div>
</div>

</body>
</html>
