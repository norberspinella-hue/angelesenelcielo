<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview de PetProfileCard (70% / 30%)</title>
  <style>
    body {
      background-color: #f4f0fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Contenedor principal simulando el popup */
    .modal-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* TARJETA 1 — EL RECUERDO */
    .card-recuerdo {
      width: 360px;
      height: 374px;
      border-radius: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 40px rgba(100, 70, 150, 0.18);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      /* Gradiente de fondo global de la tarjeta */
      background: linear-gradient(180deg, #D5B2F1 0%, #EAA8C3 60%, #F5D3C8 100%);
    }

    /* Sección superior: 70% (Simula previewrecuerdo.svg) */
    .section-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70%; /* 70% de la tarjeta */
      background-color: #D5B2F1;
      z-index: 1;
    }

    /* Sección inferior: 30% (Simula bannerdogs.png) */
    .section-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30%; /* 30% de la tarjeta */
      background-color: #F5C8A0;
      z-index: 1;
    }

    /* Contenedor de contenido flexible */
    .card-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      padding: 32px 20px 24px;
      box-sizing: border-box;
    }

    /* Wrapper de la foto circular */
    .photo-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    /* Halo dorado 3D inclinado */
    .halo-dorado {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%) rotateX(45deg);
      width: 88px;
      height: 34px;
      border: 3.5px solid #FFF59D;
      box-shadow: 0 0 20px #FFF59D, 0 0 8px #FFD54F, inset 0 0 12px #FFF59D;
      background: rgba(255, 245, 157, 0.12);
      border-radius: 50%;
      z-index: 1;
    }

    /* Foto circular */
    .photo-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 4.5px solid #FFE082;
      box-shadow: 0 4px 15px rgba(255, 213, 79, 0.25);
      background-color: #ffffff;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      user-select: none;
    }

    /* Nombre (Georgia italic bold) */
    .pet-name {
      font-family: Georgia, serif;
      font-weight: bold;
      font-style: italic;
      font-size: 32px;
      color: #4A3F6B;
      margin: 0 0 4px 0;
      text-align: center;
      line-height: 1;
    }

    /* Tagline */
    .pet-tagline {
      font-size: 14px;
      color: #7B6F9A;
      font-weight: 500;
      margin: 0 0 12px 0;
      text-align: center;
    }

    /* Divisor flexible con corazón posicionado exactamente al 70% */
    .flexible-divider {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: center;
      z-index: 10;
      margin-top: auto; /* Empuja el divisor hacia la frontera flexible */
    }

    .divider-line {
      flex: 1;
      height: 2px;
      background: rgba(236, 111, 163, 0.35);
    }

    .heart-bubble {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(236, 111, 163, 0.25);
      flex-shrink: 0;
      margin: 0 10px;
    }

    /* Botón luces posicionado de forma absoluta en la parte inferior */
    .btn-luces {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 999px;
      padding: 8px 24px;
      color: #4A3F6B;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.08);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-luces:hover {
      background: rgba(255, 255, 255, 0.70);
    }
  </style>
</head>
<body>

  <div class="modal-overlay">
    
    <!-- TARJETA 1 — EL RECUERDO -->
    <div class="card-recuerdo">
      
      <!-- Sección superior 70% (cielo) -->
      <div class="section-top"></div>

      <!-- Sección inferior 30% (perritos) -->
      <div class="section-bottom"></div>

      <!-- Contenido flexible superpuesto -->
      <div class="card-content">
        
        <!-- Foto circular con halo dorado -->
        <div class="photo-wrapper">
          <!-- Halo dorado 3D inclinado -->
          <div class="halo-dorado"></div>
          <!-- Foto circular -->
          <div class="photo-circle">
            🐶
          </div>
        </div>

        <!-- Nombre -->
        <h3 class="pet-name">Galleta</h3>

        <!-- Tagline -->
        <p class="pet-tagline">Siempre en nuestros corazones</p>

        <!-- Divisor flexible con corazón -->
        <div class="flexible-divider">
          <div class="divider-line"></div>
          <div class="heart-bubble">🩷</div>
          <div class="divider-line"></div>
        </div>

        <!-- Botón luces posicionado de forma absoluta en la base -->
        <a href="#" class="btn-luces">
          🐾 9 luces en el cielo
        </a>

      </div>

    </div>

  </div>

</body>
</html>
