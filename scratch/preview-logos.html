<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Previa de Logos de Redes Sociales</title>
  <style>
    body {
      background-color: #f7f3f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card-share-preview {
      width: 360px;
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      border: 1px solid rgba(236,111,163,0.15);
      box-shadow: 0 12px 40px rgba(100,70,150,0.10);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .social-row {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: center;
      margin-top: 10px;
    }

    .social-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .social-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .social-label {
      font-size: 11px;
      color: #4A3F6B;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* WhatsApp with glow shadow */
    .whatsapp-bg {
      background-color: #25D366;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
    }

    /* Instagram with glow shadow */
    .instagram-bg {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      box-shadow: 0 8px 20px rgba(220, 39, 67, 0.35);
    }

    /* Facebook with glow shadow */
    .facebook-bg {
      background-color: #1877F2;
      box-shadow: 0 8px 20px rgba(24, 119, 242, 0.35);
    }

    /* Copy Link with glow shadow */
    .copy-bg {
      background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
    }

    .social-btn-container:hover .social-icon-circle {
      transform: translateY(-2px);
    }
    .social-btn-container:hover .whatsapp-bg {
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.45);
    }
    .social-btn-container:hover .instagram-bg {
      box-shadow: 0 10px 24px rgba(220, 39, 67, 0.45);
    }
    .social-btn-container:hover .facebook-bg {
      box-shadow: 0 10px 24px rgba(24, 119, 242, 0.45);
    }
    .social-btn-container:hover .copy-bg {
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.45);
    }
  </style>
</head>
<body>

  <div class="card-share-preview">
    <div class="social-row">
      
      <!-- WhatsApp -->
      <div class="social-btn-container">
        <div class="social-icon-circle whatsapp-bg">
          <svg width="24" height="24" viewBox="0 0 16 16" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
          </svg>
        </div>
        <span class="social-label">WhatsApp</span>
      </div>

      <!-- Instagram -->
      <div class="social-btn-container">
        <div class="social-icon-circle instagram-bg">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5.5" stroke="white" stroke-width="2.2"/>
            <circle cx="12" cy="12" r="4.4" stroke="white" stroke-width="2.2"/>
            <circle cx="17.3" cy="6.7" r="1.3" fill="white"/>
          </svg>
        </div>
        <span class="social-label">Instagram</span>
      </div>

      <!-- Facebook -->
      <div class="social-btn-container">
        <div class="social-icon-circle facebook-bg">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 13.5h2.5l1-4H14v-2c0-1.03.3-2 2-2h1.5V1.5c-.3-.04-1.2-.1-2.5-.1-2.6 0-4.5 1.6-4.5 4.5v3.1H7v4h3.5V22h3.5V13.5z" fill="white"/>
          </svg>
        </div>
        <span class="social-label">Facebook</span>
      </div>

      <!-- Copiar enlace -->
      <div class="social-btn-container">
        <div class="social-icon-circle copy-bg">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <span class="social-label">Copiar enlace</span>
      </div>

    </div>
  </div>

</body>
</html>
