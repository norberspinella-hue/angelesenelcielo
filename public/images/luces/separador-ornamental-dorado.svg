<svg width="140" height="14" viewBox="0 0 140 14" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-sep-grad" x1="0" y1="7" x2="140" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C288" stop-opacity="0" />
