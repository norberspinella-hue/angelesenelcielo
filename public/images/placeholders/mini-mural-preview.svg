<svg xmlns="http://www.0000.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Mini Mural Preview placeholder -->
  <rect width="400" height="300" fill="#FFF8F4" rx="16" />
  
  <g opacity="0.6">
    <!-- Grid pattern -->
    <rect x="20" y="20" width="40" height="40" fill="#F8C7D8" rx="4" />
    <rect x="70" y="20" width="40" height="40" fill="#D4AF37" rx="4" />
    <rect x="120" y="20" width="40" height="40" fill="#001F3F" rx="4" />
    
    <rect x="20" y="70" width="40" height="40" fill="#E6E6FA" rx="4" />
