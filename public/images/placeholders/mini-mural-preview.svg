    <rect x="120" y="70" width="40" height="40" fill="#F5E6D3" rx="4" />
    
    <!-- And some more abstract slots -->
    <rect x="20" y="120" width="90" height="90" fill="#D4AF37" rx="8" /> <!-- 2x2 block -->
